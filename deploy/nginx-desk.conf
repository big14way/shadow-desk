# The desk behind nginx. No access log: the desk never sees or stores IP addresses (build guide §17).
server {
    listen 443 ssl;
    http2 on;
    server_name desk.example.com;

    ssl_certificate     /etc/letsencrypt/live/desk.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/desk.example.com/privkey.pem;

    access_log off;
    error_log /var/log/nginx/desk.error.log crit;

    # Evidence uploads are sealed boxes of at most 2 MB (base64url in JSON).
    client_max_body_size 4m;

    location / {
        proxy_pass http://127.0.0.1:8787;
        # Deliberately no X-Forwarded-For / X-Real-IP: the app has no use for client addresses.
        proxy_set_header Host $host;
        proxy_read_timeout 60s;
    }
}
