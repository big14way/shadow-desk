# frostd behind nginx with Let's Encrypt (build guide §16), adapted from the FROST Book's sample.
# frostd runs with --no-tls-very-insecure on 127.0.0.1:2744; nginx terminates TLS.
# Participants use: --server-url frost.example.com:443

limit_req_zone $binary_remote_addr zone=frost_auth:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=frost_api:10m rate=30r/s;

server {
    listen 443 ssl;
    http2 on;
    server_name frost.example.com;

    ssl_certificate     /etc/letsencrypt/live/frost.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/frost.example.com/privkey.pem;

    # frostd only relays end-to-end encrypted messages; don't keep who-connected-when either.
    access_log off;
    error_log /var/log/nginx/frostd.error.log crit;

    client_max_body_size 1m;

    location = /challenge          { limit_req zone=frost_auth burst=5 nodelay; proxy_pass http://127.0.0.1:2744; }
    location = /create_new_session { limit_req zone=frost_auth burst=5 nodelay; proxy_pass http://127.0.0.1:2744; }
    location / {
        limit_req zone=frost_api burst=60 nodelay;
        proxy_pass http://127.0.0.1:2744;
        proxy_read_timeout 120s;
    }
}
